[project]
name = "aithre"
version = "0.1.0"
description = "GUI for the I23 laser shaping system at Diamond Light Source"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyqt5",
    "opencv-python-headless",
    "numpy",
    "requests",
    "zmq",
    "asyncio",
    "httpx",
    "qasync",
    "ruff",
    "rust>=1.3.1",
    "ipython>=8.32.0",
]

[project.optional-dependencies]
# Not used by the GUI yet; for Bluesky scripts and future integration
bluesky = [
    "bluesky>=1.15",
    "ophyd-async>=0.21",
    "softioc",
    "mx-bluesky>=1.6.16",
    "blueapi>=1.21",
]

[tool.setuptools]
py-modules = []
